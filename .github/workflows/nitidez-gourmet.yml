name: Corregir nitidez gourmet
on:
  push:
    branches: [main]
    paths:
      - scripts/mejorar_nitidez_gourmet.py
      - .github/workflows/nitidez-gourmet.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nitidez:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow
        run: python -m pip install Pillow
      - name: Mejorar las 28 imágenes
        run: python scripts/mejorar_nitidez_gourmet.py
      - name: Publicar imágenes corregidas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/img/gourmet-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Reemplazar 28 imágenes borrosas por fotos gourmet nítidas"
            git pull --rebase origin main
            git push
          fi
