name: Fotografías individuales Food Store
on:
  push:
    branches: [main]
    paths:
      - scripts/fotos_por_producto.py
      - .github/workflows/fotos-individuales.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogo-fotografico:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow
        run: python -m pip install Pillow
      - name: Obtener fotos del producto exacto y optimizar
        run: python scripts/fotos_por_producto.py
      - name: Guardar fotografías y créditos en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/img/*.webp FOTOS_CREDITOS.md
          if ! git diff --cached --quiet; then
            git commit -m "Agregar 28 fotos específicas según producto"
            git pull --rebase origin main
            git push
          fi
